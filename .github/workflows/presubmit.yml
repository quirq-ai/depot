# Hand-written until infra-config generates this repo's presubmit (V0-CFG-02).
# Runs on every PR and in the merge queue, so the gate sees the exact merge result.
name: presubmit
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider
      # sync's "no other parser" check: manifests are read only through qqsync.
      # Its own environment, so the guard's sync commit can differ from the library pins.
      - name: no second manifest parser
        run: |
          python -m venv "$RUNNER_TEMP/guard"
          "$RUNNER_TEMP/guard/bin/pip" install --quiet "qqsync @ git+https://github.com/quirq-ai/sync@8f624f4a7fe3abdab2c7b83376f1ae7772073fd4"  # TODO(expert): let rollers move this pin.
          "$RUNNER_TEMP/guard/bin/qqsync" guard .
