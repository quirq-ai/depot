[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "qqdepot"
dynamic = ["version"]
description = "qq, the quirq infra command line: self-updating and version-pinned per repo."
readme = "README.md"
requires-python = ">=3.11.4"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Other qq repos by pinned commit, never by copying code. TODO(expert): let rollers move this pin.
dependencies = [
    "qqsync @ git+https://github.com/quirq-ai/sync@9f4c77ebe2c81d6ffd643d737a35b962f6fd322a",
    "qqrecipes @ git+https://github.com/quirq-ai/recipes@2dc05d038ad9023d0110f0f0b78df4e34f7a25f3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
qq = "qqdepot.cli:main"

[tool.setuptools.dynamic]
version = { attr = "qqdepot.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qqdepot = ["locks/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
