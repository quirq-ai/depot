[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "qqdepot"
dynamic = ["version"]
description = "qq, the quirq infra command line: self-updating and version-pinned per repo."
readme = "README.md"
requires-python = ">=3.11.4"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Other qq repos by pinned commit, never by copying code. TODO(expert): let rollers move this pin.
dependencies = [
    "qqsync @ git+https://github.com/quirq-ai/sync@aecb0fdb89f0d88b61a26052f5b3c26c48392841",
    "qqrecipes @ git+https://github.com/quirq-ai/recipes@3af54a85c73535400b423bc57bd96054c008e594",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
qq = "qqdepot.cli:main"

[tool.setuptools.dynamic]
version = { attr = "qqdepot.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qqdepot = ["locks/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
