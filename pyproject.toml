[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "qqdepot"
dynamic = ["version"]
description = "qq, the quirq infra command line: self-updating and version-pinned per repo."
readme = "README.md"
requires-python = ">=3.11.4"
# Other qq repos by pinned commit, never by copying code. TODO(expert): let rollers move this pin.
dependencies = [
    "qqsync @ git+https://github.com/quirq-ai/sync@8f624f4a7fe3abdab2c7b83376f1ae7772073fd4",
    "qqrecipes @ git+https://github.com/quirq-ai/recipes@c6d8f3064d535fc51a5c90ed1a8cb03d03b4a817",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
qq = "qqdepot.cli:main"

[tool.setuptools.dynamic]
version = { attr = "qqdepot.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
