[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "qqdepot"
dynamic = ["version"]
description = "qq, the quirq infra command line: self-updating and version-pinned per repo."
readme = "README.md"
requires-python = ">=3.11"
# Other qq repos by pinned commit, never by copying code. TODO(expert): let rollers move this pin.
dependencies = ["qqsync @ git+https://github.com/quirq-ai/sync@5abac76af194a40961074ce75432f4fdb79fe951"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
qq = "qqdepot.cli:main"

[tool.setuptools.dynamic]
version = { attr = "qqdepot.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
